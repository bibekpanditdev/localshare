name: Release Windows App

on:
  push:
    tags:
      - 'v*'
    branches: [ windows-client ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish

      - name: Create Zip
        run: Compress-Archive -Path ./publish/* -DestinationPath LocalShareWindows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalShareWindows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
